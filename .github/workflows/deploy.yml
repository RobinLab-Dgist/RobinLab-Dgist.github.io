name: Deploy

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # 매일 KST 00:00 (UTC 15:00)에 다시 빌드해 Deadlines 데이터를 갱신
  schedule:
    - cron: '0 15 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
