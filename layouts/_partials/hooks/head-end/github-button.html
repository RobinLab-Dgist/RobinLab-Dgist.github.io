<script async defer src="https://buttons.github.io/buttons.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const dialog = document.getElementById('pi-hobby-dialog');
  const openers = document.querySelectorAll('[data-pi-hobby-open]');
  const closer = document.querySelector('[data-pi-hobby-close]');
  if (!dialog || !openers.length || !closer) return;
  openers.forEach((opener) => opener.addEventListener('click', () => {
    const hobby = opener.dataset.hobby;
    const input = hobby && document.getElementById(`hobby-${hobby}`);
    if (input) input.checked = true;
    dialog.showModal();
  }));
  closer.addEventListener('click', () => dialog.close());
  dialog.addEventListener('click', (event) => {
    if (event.target === dialog) dialog.close();
  });
});

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('[data-join-language]').forEach((join) => {
    const selectLanguage = (language) => {
      join.dataset.joinLanguage = language;
      join.querySelectorAll('[data-join-language-option]').forEach((button) => {
        const selected = button.dataset.joinLanguageOption === language;
        button.classList.toggle('is-active', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      join.querySelectorAll('[data-join-language-panel]').forEach((panel) => {
        panel.hidden = panel.dataset.joinLanguagePanel !== language;
      });
    };

    join.querySelectorAll('[data-join-language-option]').forEach((button) => {
      button.addEventListener('click', () => selectLanguage(button.dataset.joinLanguageOption));
    });
  });
});

document.addEventListener('DOMContentLoaded', () => {
  const publications = document.querySelector('.robin-publications');
  if (!publications) return;

  publications.querySelectorAll('li').forEach((entry) => {
    const video = entry.querySelector('video source');
    if (!video || entry.querySelector('.pub-badge-video')) return;

    let badges = entry.querySelector('.pub-badges');
    if (!badges) {
      badges = document.createElement('div');
      badges.className = 'pub-badges';
      entry.appendChild(badges);
    }
    const badge = document.createElement('a');
    badge.className = 'pub-badge pub-badge-video';
    badge.textContent = 'Video';
    badge.href = video.getAttribute('src');
    badge.target = '_blank';
    badge.rel = 'noopener noreferrer';
    badge.setAttribute('aria-label', 'Video preview');
    badges.appendChild(badge);
    entry.appendChild(badges);
  });
});

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.robin-research-player video').forEach((video) => {
    video.controls = false;
    video.autoplay = true;
    video.muted = true;
    video.loop = true;
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.setAttribute('loop', '');
    video.removeAttribute('controls');
  });
  const topicTags = {
    Interface: '#HapticInterface', Perception: '#Perception', Teleoperation: '#Teleoperation',
    'Digital Twin': '#GaussianSplatting', Simulation: '#Simulation', HRI: '#HumanRobotInteraction',
    'Imitation Learning': '#ImitationLearning', 'Reinforcement Learning': '#ReinforcementLearning',
    'Robot Foundation Models': '#RobotFoundationModels'
  };
  document.querySelectorAll('.robin-research-topic-chip').forEach((chip) => {
    chip.textContent = topicTags[chip.textContent.trim()] || `#${chip.textContent.trim().replace(/\s+/g, '')}`;
  });
});

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.robin-research-player').forEach((player) => {
    const video = player.querySelector('video');
    if (video && !player.dataset.label) player.dataset.label = video.getAttribute('aria-label') || 'Research preview';
  });
});

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.robin-publications li').forEach((entry) => {
    if (entry.querySelector('.robin-publication-copy')) return;
    const host = entry.querySelector('.robin-publication-entry > div') || entry;
    const source = document.createElement('div');
    Array.from(host.childNodes).forEach((node) => {
      if (!(node.nodeType === Node.ELEMENT_NODE && (node.matches('video, .pub-badges') || node.closest('.pub-badges')))) source.appendChild(node.cloneNode(true));
    });
    const text = source.textContent.trim();
    const match = text.match(/^(.*?)[“"](.*?)[”"]([,\s]*)(.*)$/s);
    const copy = document.createElement('div');
    copy.className = 'robin-publication-copy';
    if (match) {
      const authors = document.createElement('div');
      authors.className = 'robin-publication-authors';
      authors.textContent = match[1].replace(/,\s*$/, '');
      const title = document.createElement('div');
      title.className = 'robin-publication-title';
      title.textContent = match[2].replace(/,\s*$/, '');
      const meta = document.createElement('div');
      meta.className = 'robin-publication-meta';
      meta.textContent = match[4];
      // 본문의 [ICRA] 표기는 (ICRA)로, Top n%는 별도 색으로 승격.
      // textContent를 먼저 넣었으므로 innerHTML은 이미 이스케이프된 상태다.
      meta.innerHTML = meta.innerHTML
        .replace(/\[([^\]]+)\]/g, '<strong class="robin-venue-abbr">($1)</strong>')
        .replace(/\bTop\s+\d+(?:\.\d+)?%/g, '<strong class="robin-venue-top">$&</strong>')
        .replace(/\bOral\s+Paper\b/g, '<strong class="robin-venue-top">$&</strong>');
      copy.append(authors, title, meta);
    } else {
      const title = document.createElement('div');
      title.className = 'robin-publication-title';
      title.textContent = text;
      copy.appendChild(title);
    }
    const badges = entry.querySelector('.pub-badges');
    host.replaceChildren(copy);
    if (badges) entry.appendChild(badges);
    const authorText = copy.querySelector('.robin-publication-authors');
    if (authorText) {
      const highlightedOccurrence = Number(entry.dataset.highlightYLee || 1);
      let occurrence = 0;
      authorText.innerHTML = authorText.textContent.replace(/\bY\. Lee\b/g, (name) => {
        occurrence += 1;
        return occurrence === highlightedOccurrence
          ? `<strong class="robin-author-highlight">${name}</strong>`
          : name;
      });
      if (entry.dataset.pubnum === 'PR1') {
        authorText.innerHTML = authorText.innerHTML.replace(
          /\bK\. Lee\b/,
          '<strong class="robin-author-highlight">K. Lee</strong>',
        );
      }
    }
  });
});

document.addEventListener('DOMContentLoaded', () => {
  const root = document.querySelector('.robin-publications');
  const buttons = root ? root.querySelectorAll('.robin-pub-filter-btn') : [];
  if (!buttons.length) return;

  // 모드별로 남길 항목의 셀렉터. all은 전부 표시.
  const MODES = {
    selected: { cls: 'is-filtered', keep: 'li[data-selected]' },
    all: { cls: null, keep: null },
  };

  const apply = (mode) => {
    const conf = MODES[mode] || MODES.all;
    Object.values(MODES).forEach(({ cls }) => cls && root.classList.remove(cls));
    if (conf.cls) root.classList.add(conf.cls);
    buttons.forEach((btn) => {
      const on = btn.dataset.filter === mode;
      btn.classList.toggle('is-active', on);
      btn.setAttribute('aria-pressed', String(on));
    });
    // 남는 항목이 없는 분류는 제목까지 숨긴다
    root.querySelectorAll('ol').forEach((ol) => {
      const keep = !conf.keep || ol.querySelector(conf.keep);
      ol.hidden = !keep;
      const heading = ol.previousElementSibling;
      if (heading && heading.tagName === 'H2') heading.hidden = !keep;
    });
  };

  buttons.forEach((btn) => btn.addEventListener('click', () => apply(btn.dataset.filter)));
  apply('selected');
});

document.addEventListener('DOMContentLoaded', () => {
  const publicationVideos = document.querySelectorAll('.robin-publication-entry video');

  if ('IntersectionObserver' in window) {
    const preloadVisibleVideos = new IntersectionObserver((entries) => {
      entries.forEach(({ isIntersecting, target: video }) => {
        if (isIntersecting) {
          if (video.preload !== 'auto') {
            video.preload = 'auto';
            video.load();
          }
          video.play().catch(() => {});
        } else {
          video.pause();
        }
      });
    }, { rootMargin: '480px 0px' });
    publicationVideos.forEach((video) => preloadVisibleVideos.observe(video));
  } else {
    publicationVideos.forEach((video) => {
      video.preload = 'auto';
      video.load();
    });
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const heroVideo = document.querySelector('.robin-cinematic-video');
  if (!heroVideo) return;
  const hero = heroVideo.closest('.robin-cinematic-hero');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  heroVideo.loop = false;
  heroVideo.muted = true;
  // The poster stays above a visible video so iOS can start inline playback.
  const showPoster = () => hero.classList.remove('is-video-ready');
  const showPlayingFrame = () => {
    if (!reducedMotion.matches && !heroVideo.paused &&
        heroVideo.readyState >= 2 && heroVideo.currentTime >= 0.2) {
      hero.classList.add('is-video-ready');
    }
  };
  const play = () => {
    if (reducedMotion.matches || heroVideo.ended || heroVideo.error) return;
    try {
      const pending = heroVideo.play();
      if (pending && pending.catch) pending.catch(showPoster);
    } catch (_) {
      showPoster();
    }
  };
  // The encoded final frame holds naturally; never seek on timeupdate/ended.
  heroVideo.addEventListener('timeupdate', showPlayingFrame);
  heroVideo.addEventListener('playing', showPlayingFrame);
  ['error', 'waiting', 'emptied'].forEach((event) => heroVideo.addEventListener(event, showPoster));
  heroVideo.addEventListener('stalled', () => {
    if (heroVideo.readyState < 3) showPoster();
  });
  heroVideo.addEventListener('pause', () => {
    if (!heroVideo.ended) showPoster();
  });
  const onMotionChange = () => {
    if (reducedMotion.matches) {
      showPoster();
      heroVideo.pause();
    } else {
      play();
    }
  };
  if (reducedMotion.addEventListener) reducedMotion.addEventListener('change', onMotionChange);
  else if (reducedMotion.addListener) reducedMotion.addListener(onMotionChange);

  // An intentional tap on the film can unlock an in-app browser's autoplay policy.
  // Keep navigation links untouched and do not introduce playback controls.
  let tapRetried = false;
  hero.addEventListener('pointerup', (event) => {
    if (tapRetried || reducedMotion.matches || heroVideo.ended ||
        event.target.closest('a, button, input, select, textarea')) return;
    if (!hero.classList.contains('is-video-ready')) {
      tapRetried = true;
      play();
    }
  }, { passive: true });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && !heroVideo.ended) showPoster();
  });
  showPoster();
  play();
});
</script>
